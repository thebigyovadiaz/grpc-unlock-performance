syntax = "proto3";

package hello;

option go_package="github.com/thebigyovadiaz/grpc-unlock-performance";

// Greeter service definition.
service Greeter {
  // Sends greeting
  rpc SayHello (HelloRequest) returns (HelloResponse) {}
}

// Request message containing the user's name.
message HelloRequest {
  string name = 1;
  string lastname = 2;
}

// Response containing the greetings
message HelloResponse {
  string message = 1;
}
